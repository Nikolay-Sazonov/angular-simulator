<section class="users flex">
  <h1 class="user__title">Список Пользователей</h1>
  <button class="btn cursor" id="open-create-modal" style="left: 0; position: absolute;" (click)="openCreateModal()">Создать пользователя</button>
  <div class="container flex">
    @for (user of filteredUsers$ | async; track user.id) {
      <app-user-card [user]="user" (delete)="onDeleteUser($event)"></app-user-card>
    }@empty {
      <div class="error">Нет пользователей для отображения</div>
    }
  </div>

  <app-users-filter (searchChange)="onSearchChange($event)"></app-users-filter>

  @if (isCreateModalOpen) {
    <div class="modal-overlay" (click)="closeCreateModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
            <button class="modal-close" (click)="closeCreateModal()">x</button>
        <app-user-create (created)="onUserCreated($event)"></app-user-create>
      </div>
    </div>
  }
</section>
